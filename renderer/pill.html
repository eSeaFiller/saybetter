<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>SayBetter Pill</title>
  <link rel="stylesheet" href="pill.css" />
</head>
<body>
  <div id="pill" class="pill collapsed">
    <!-- 收起态：一颗安静的胶囊，只有方向标和一条进度线 -->
    <div class="bar">
      <span id="dot" class="dot"></span>
      <span id="direction" class="direction"></span>
      <span class="spacer"></span>
      <span id="peek" class="peek"></span>
    </div>
    <div id="progress" class="progress"></div>

    <!-- 展开态 -->
    <div id="body" class="body">
      <div class="sheet">
        <!-- 主体：改好的那句话 -->
        <p id="headline" class="headline"></p>
        <p id="source" class="source"></p>

        <!-- 语气切换：纯文字，不做成按钮 -->
        <div id="tones" class="tones"></div>

        <!-- 为什么这样说 -->
        <div id="why-wrap" class="section">
          <div id="why-label" class="label"></div>
          <div id="why" class="why"></div>
        </div>
      </div>

      <div class="foot">
        <span id="hint" class="hint"></span>
        <button id="btn-copy" class="action"></button>
        <button id="btn-close" class="action icon">✕</button>
      </div>
    </div>
  </div>
  <script src="pill.js"></script>
</body>
</html>
