<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>Saybetter-A lingoisland Island</title>
  <link rel="stylesheet" href="pill.css" />
</head>
<body>
  <main id="island" class="island collapsed">
    <header class="island-bar">
      <span class="brand-mark"><i></i></span>
      <strong class="brand-name">Saybetter-A lingoisland</strong>
      <span id="pill-language" class="language">→ EN</span>
      <span id="preview" class="preview"></span>
      <span id="dot" class="dot working"></span>
      <button id="btn-close" class="icon-button" title="关闭">×</button>
    </header>
    <nav id="pill-modes" class="pill-modes" aria-label="表达模式">
      <button class="pill-mode on" data-mode="default">默认</button>
      <button class="pill-mode" data-mode="formal">正式</button>
      <button class="pill-mode" data-mode="casual">口语</button>
      <button class="pill-mode" data-mode="concise">简洁</button>
      <button class="pill-mode" data-mode="learning">学习</button>
    </nav>
    <section id="pill-custom" class="pill-custom" hidden>
      <textarea id="pill-custom-prompt" maxlength="4000" placeholder="输入你的 AI Prompt…"></textarea>
      <button id="btn-apply-custom">应用</button>
    </section>
    <section class="island-body">
      <p id="source" class="source"></p>
      <article id="output" class="output"></article>
      <section id="pill-sources" class="pill-sources" hidden></section>
      <footer>
        <span id="status">生成中…</span>
        <div class="result-buttons">
          <button id="btn-favorite" class="favorite-button" disabled>收藏</button>
          <button id="btn-copy" class="copy-button">复制结果</button>
        </div>
      </footer>
    </section>
  </main>
  <script src="pill.js"></script>
</body>
</html>
